<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="author" content="Ross Landgreen">
	<title>bells</title>
	<link rel="stylesheet" href="style.css">
	<link rel='shortcut icon' href='favicon.ico' type='image/x-icon' />
	<style>
		/* Weather Widget Styling */
		#weather-widget {
			position: absolute;
			top: 20px;
			right: 20px;
			width: 320px;
			height: 140px;
			background: linear-gradient(135deg, #4a90e2, #8ac3f2);
			padding: 15px;
			border-radius: 15px;
			box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
			font-family: Arial, sans-serif;
			color: white;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		#weather-widget .icon {
			width: 100px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}

		#weather-widget img {
			width: 80px;
			height: 80px;
			margin-bottom: 5px;
		}

		#weather-widget .details {
			flex: 1;
			padding-left: 15px;
			display: flex;
			flex-direction: column;
		}

		#weather-widget .details h2 {
			font-size: 16px;
			margin: 0;
		}

		#weather-widget .details h1 {
			font-size: 50px;
			margin: 5px 0 0 0;
		}

		#weather-widget .details span {
			font-size: 12px;
			opacity: 0.8;
		}

		#weather-widget .divider {
			width: 1px;
			height: 100%;
			background-color: rgba(255, 255, 255, 0.5);
			margin: 0 15px;
		}
	</style>
</head>

<body>
	<!-- Canvas and Main SVG Content -->
	<svg viewBox="0 0 200 100">
		<g font-weight='100'>
			<text id="time" x="100" y="2" font-size='55px' text-anchor="middle" alignment-baseline="hanging" onclick="toggleMode()"></text>
			<text id="week-day" x="1" y="61" font-size='11px' text-anchor="start" alignment-baseline="baseline"></text>
			<text id="date" x="1" y="74" font-size='11px' text-anchor="start" alignment-baseline="baseline"></text>
			<a href="https://www.google.com/search?q=weather" rel="noopener" target="_blank">
				<text id="weather" x="199" y="61" font-size='7px' text-anchor="end" alignment-baseline="baseline"></text>
				<text id="temp" x="199" y="74" font-size='11px' text-anchor="end" alignment-baseline="baseline"></text>
			</a>
			<text id="period" x="100" y="74" font-size='15px' text-anchor="middle" alignment-baseline="baseline"></text>
		</g>
		<g id="period-zone" transform="translate(0,77)" onclick="toggleZoom()" font-weight='300'>
			<g class='period' stroke='#333' stroke-width='0.15'>
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="0" x="0" y="0" width="0" height="20" />

				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="2" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="3" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="4" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="5" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="6" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="7" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="8" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="9" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="10" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="11" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="12" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="13" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="14" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="15" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="16" x="0" y="0" width="0" height="20" />
				<rect onmouseout="drawCurrentPeriod(schedule[schedule.current])" onmouseover="enterBlock(this)" id="17" x="0" y="0" width="0" height="20" />
			</g>
			<path id='now' fill='none' stroke='#f05' stroke-width='0.5' stroke-linecap="round" d="" />
			<g transform="translate(0,10.5)" font-size='5px' text-anchor="middle">
				<text onmouseover="enterBlock(this)" id="n0" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n1" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n2" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n3" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n4" x="0" y="0" alignment-baseline="middle"></text>

				<text onmouseover="enterBlock(this)" id="n7" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n8" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n9" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n10" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n11" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n12" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n13" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n14" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n15" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n16" x="0" y="0" alignment-baseline="middle"></text>
				<text onmouseover="enterBlock(this)" id="n17" x="0" y="0" alignment-baseline="middle"></text>
			</g>
		</g>
	</svg>

	<!-- Weather Widget -->
	<div id="weather-widget">
		<div class="icon">
			<img src="" alt="Weather Icon" id="weather-icon">
			<p id="weather-description">Loading...</p>
		</div>
		<div class="divider"></div>
		<div class="details">
			<h2 id="weather-location"></h2>
			<span id="weather-date"></span>
			<h1 id="weather-temperature"></h1>
			<span id="weather-temp-fahrenheit"></span>
		</div>
	</div>

	<script src="index.js"></script>
	<script>
		// Weather API Configuration
		const WEATHERSTACK_API_KEY = "1b5049892986509bdea64414c486cdc9"; // Replace with your API key
		const LOCATION = "1905 Armacost Ave, Los Angeles, CA 90025"; // Replace with your location

		// Fetch and display weather data
		async function loadWeather() {
			const weatherIcon = document.getElementById("weather-icon");
			const weatherDescription = document.getElementById("weather-description");
			const weatherLocation = document.getElementById("weather-location");
			const weatherDate = document.getElementById("weather-date");
			const weatherTemperature = document.getElementById("weather-temperature");
			const weatherTempFahrenheit = document.getElementById("weather-temp-fahrenheit");

			try {
				const url = `https://api.weatherstack.com/current?access_key=${WEATHERSTACK_API_KEY}&query=${encodeURIComponent(LOCATION)}`;
				const response = await fetch(url);
				const data = await response.json();

				if (data && data.current) {
					// Update widget with weather data
					const { temperature, weather_descriptions, weather_icons } = data.current;
					const tempFahrenheit = (temperature * 9) / 5 + 32; // Convert Celsius to Fahrenheit
					const date = new Date();
					const options = { weekday: "long", month: "long", day: "numeric" };

					weatherIcon.src = weather_icons[0];
					weatherDescription.textContent = weather_descriptions[0];
					weatherLocation.textContent = `${data.location.name}, ${data.location.country}`;
					weatherDate.textContent = date.toLocaleDateString(undefined, options);
					weatherTemperature.textContent = `${temperature}°C`;
					weatherTempFahrenheit.textContent = `${tempFahrenheit.toFixed(1)}°F`;
				} else {
					throw new Error("Weather data unavailable.");
				}
			} catch (error) {
				console.error("Error loading weather:", error);
				weatherDescription.textContent = "Unable to load weather data.";
			}
		}

		// Load weather on page load
		loadWeather();
	</script>
</body>

</html>
