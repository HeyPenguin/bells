		/* Weather Widget Styling */
		#weather-widget {
			position: absolute;
			top: 20px;
			right: 20px;
			width: 320px;
			height: auto;
			background: linear-gradient(135deg, #4a90e2, #8ac3f2);
			padding: 15px;
			border-radius: 15px;
			box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
			font-family: Arial, sans-serif;
			color: white;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		#weather-widget .icon {
			width: 80px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}

		#weather-widget img {
			width: 60px;
			height: 60px;
			margin-bottom: 5px;
		}

		#weather-widget .details {
			flex: 1;
			padding-left: 15px;
			display: flex;
			flex-direction: column;
		}

		#weather-widget .details h2 {
			font-size: 16px;
			margin: 0;
		}

		#weather-widget .details h1 {
			font-size: 36px;
			margin: 5px 0 0 0;
		}

		#weather-widget .details span {
			font-size: 12px;
			opacity: 0.8;
		}

		/* Time Styles */
		#time {
			font-size: 35px; /* Reduced size for better fit */
		}

		/* Divider for the weather widget */
		#weather-widget .divider {
			width: 1px;
			height: 100%;
			background-color: rgba(255, 255, 255, 0.5);
			margin: 0 15px;
		}
	</style>

	<script>
		
const WEATHER_API_KEY = "0d1e02e28cb944fcb74203653250205"; // Replace with your valid API key
const LOCATION = "34.0360661,-118.4553064"; // Coordinates for Los Angeles

async function loadWeather() {
  const weatherIcon = document.getElementById("weather-icon");
  const weatherDescription = document.getElementById("weather-description");
  const weatherLocation = document.getElementById("weather-location");
  const weatherDate = document.getElementById("weather-date");
  const weatherTemperature = document.getElementById("weather-temperature");
  const weatherTempFahrenheit = document.getElementById("weather-temp-fahrenheit");

  try {
    // Fetch weather data from WeatherAPI
    const url = `https://api.weatherapi.com/v1/current.json?key=${WEATHER_API_KEY}&q=${encodeURIComponent(LOCATION)}`;
    const response = await fetch(url);

    // Handle JSON response
    const data = await response.json();

    if (response.ok) {
      const { temp_c, temp_f, condition } = data.current;
      const date = new Date(data.location.localtime);
      const options = { weekday: "long", month: "long", day: "numeric" };

      // Update the weather widget
      weatherIcon.src = `https:${condition.icon}`;
      weatherDescription.textContent = condition.text;
      weatherLocation.textContent = `${data.location.name}, ${data.location.country}`;
      weatherDate.textContent = date.toLocaleDateString(undefined, options);
      weatherTemperature.textContent = `${temp_c}°C`;
      weatherTempFahrenheit.textContent = `${temp_f}°F`;
    } else {
      console.error("Error fetching weather data:", data.error.message);
      weatherDescription.textContent = "Unable to load weather data.";
    }
  } catch (error) {
    console.error("Error during fetch:", error);
    weatherDescription.textContent = "Unable to load weather data.";
  }
}

// Call the function on page load
loadWeather();
	</script>
